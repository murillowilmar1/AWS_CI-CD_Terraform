version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -o terraform.zip -L https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip -o terraform.zip && mv terraform /usr/local/bin/
  build:
    commands:
      # El tfplan viaja como fuente secundaria (build_output); el resto
      # del repo (modules/, los scripts .py) llega por la fuente
      # primaria (source_output).
      - cp $CODEBUILD_SRC_DIR_build_output/multi-fuente-demo/fuentes/fuente-postgres/infra/tfplan multi-fuente-demo/fuentes/fuente-postgres/infra/tfplan
      - cd multi-fuente-demo/fuentes/fuente-postgres/infra
      - terraform init
          -backend-config="bucket=${TFSTATE_BUCKET}"
          -backend-config="key=multi-fuente-demo/fuentes/fuente-postgres/${ENVIRONMENT}/terraform.tfstate"
          -backend-config="region=${TFSTATE_REGION}"
      - terraform apply -auto-approve tfplan
