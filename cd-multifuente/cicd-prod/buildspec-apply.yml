version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -o terraform.zip -L https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip -o terraform.zip && mv terraform /usr/local/bin/
  build:
    commands:
      - cp $CODEBUILD_SRC_DIR_build_output/cd-multifuente/fuentes/fuente-${FUENTE}/infra/tfplan cd-multifuente/fuentes/fuente-${FUENTE}/infra/tfplan
      - |
        if [ "${FUENTE}" = "sqlserver" ]; then
          mkdir -p cd-multifuente/modules/lambda-function/.build
          cp $CODEBUILD_SRC_DIR_build_output/cd-multifuente/modules/lambda-function/.build/multi-fuente-sqlserver-audit-${ENVIRONMENT}.zip cd-multifuente/modules/lambda-function/.build/multi-fuente-sqlserver-audit-${ENVIRONMENT}.zip
        fi
      - cd cd-multifuente/fuentes/fuente-${FUENTE}/infra
      - terraform init
          -backend-config="bucket=${TFSTATE_BUCKET}"
          -backend-config="key=cd-multifuente/fuentes/fuente-${FUENTE}/${ENVIRONMENT}/terraform.tfstate"
          -backend-config="region=${TFSTATE_REGION}"
      - terraform apply -auto-approve tfplan
