version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -o terraform.zip -L https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip -o terraform.zip && mv terraform /usr/local/bin/
  build:
    commands:
      - cd services/ingest-sqlserver-glue/infra
      - terraform init
          -backend-config="bucket=${TFSTATE_BUCKET}"
          -backend-config="key=services/ingest-sqlserver-glue/${ENVIRONMENT}/terraform.tfstate"
          -backend-config="region=${TFSTATE_REGION}"
      - terraform plan
          -var-file="../../../env/${ENVIRONMENT}.tfvars"
          -var="region=${AWS_DEFAULT_REGION}"
          -out=tfplan

artifacts:
  files:
    - services/ingest-sqlserver-glue/infra/*.tf
    - services/ingest-sqlserver-glue/infra/tfplan
    - services/ingest-sqlserver-glue/buildspec-apply.yml
